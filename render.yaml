# Render deployment configuration
# This file defines both frontend and backend services for Render

services:
  # Backend API Service
  - type: web
    name: infinit-audit-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false  # Supabase Supavisor transaction-pooler connection string
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BASE_URL
        value: https://www.infinit-audit.co.uk
      # Add SMTP_* values in Render when email delivery is ready.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: info@infinit-audit.co.uk
      - key: SMTP_FROM_NAME
        value: Infinit Audit
      - key: SMTP_USE_SSL
        value: false
      - key: SMTP_USE_STARTTLS
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Static Site
  - type: web
    name: infinit-audit-web
    env: static
    plan: free
    buildCommand: yarn install && yarn build
    staticPublishPath: ./build
    rootDir: frontend
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          name: infinit-audit-api
          type: web
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
