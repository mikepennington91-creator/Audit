name: Apply company branding implementation

on:
  push:
    branches:
      - feature/company-logo-branding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/company-logo-branding
      - name: Add company branding support
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('backend/server.py')
          text = server.read_text()

          old = '''class CompanyResponse(BaseModel):
              model_config = ConfigDict(extra="ignore")
              id: str
              name: str
              description: Optional[str]
              created_at: str

          class CompanyUpdate(BaseModel):
              name: Optional[str] = None
              description: Optional[str] = None
          '''
          new = '''class CompanyResponse(BaseModel):
              model_config = ConfigDict(extra="ignore")
              id: str
              name: str
              description: Optional[str]
              logo_data: Optional[str] = None
              created_at: str

          class CompanyUpdate(BaseModel):
              name: Optional[str] = None
              description: Optional[str] = None

          class CompanyBrandingUpdate(BaseModel):
              logo_data: Optional[str] = None
          '''
          assert old in text, 'Company models block not found'
          text = text.replace(old, new, 1)

          marker = '''@api_router.delete("/companies/{company_id}")
          async def delete_company(company_id: str, user: dict = Depends(require_role([UserRole.SYSTEM_ADMIN]))):
          '''
          branding = '''def validate_company_logo(logo_data: Optional[str]) -> None:
              if logo_data is None:
                  return
              allowed_prefixes = (
                  "data:image/png;base64,",
                  "data:image/jpeg;base64,",
                  "data:image/webp;base64,",
              )
              if not logo_data.startswith(allowed_prefixes):
                  raise HTTPException(status_code=400, detail="Logo must be a PNG, JPG or WebP image")
              try:
                  encoded = logo_data.split(",", 1)[1]
                  raw = base64.b64decode(encoded, validate=True)
              except Exception:
                  raise HTTPException(status_code=400, detail="Invalid logo image data")
              if len(raw) > 2 * 1024 * 1024:
                  raise HTTPException(status_code=400, detail="Logo must be 2 MB or smaller")

          @api_router.put("/companies/{company_id}/branding", response_model=CompanyResponse)
          async def update_company_branding(company_id: str, data: CompanyBrandingUpdate, user: dict = Depends(get_current_user)):
              if not is_admin(user):
                  raise HTTPException(status_code=403, detail="Admin access required")
              if not is_system_admin(user) and user.get("company_id") != company_id:
                  raise HTTPException(status_code=403, detail="Cannot change branding for another company")
              company = await db.companies.find_one({"id": company_id}, {"_id": 0})
              if not company:
                  raise HTTPException(status_code=404, detail="Company not found")
              validate_company_logo(data.logo_data)
              await db.companies.update_one({"id": company_id}, {"$set": {"logo_data": data.logo_data}})
              updated = await db.companies.find_one({"id": company_id}, {"_id": 0})
              return CompanyResponse(**updated)

          ''' + marker
          assert marker in text, 'Company delete marker not found'
          text = text.replace(marker, branding, 1)

          pdf_marker = '''def format_uk_datetime(iso_string: str) -> str:
          '''
          helper = '''def build_company_pdf_header(company: Optional[dict], report_title: str, styles) -> list:
              company_name = (company or {}).get("name") or "INFINIT-AUDIT"
              company_style = ParagraphStyle(
                  'BrandCompany', parent=styles['Normal'], fontSize=13,
                  textColor=HexColor('#1a7a6e'), alignment=TA_RIGHT,
              )
              report_style = ParagraphStyle(
                  'BrandReportTitle', parent=styles['Heading1'], fontSize=18,
                  textColor=HexColor('#1a7a6e'), alignment=TA_LEFT, spaceAfter=14,
              )
              logo = None
              logo_data = (company or {}).get("logo_data")
              if logo_data and logo_data.startswith("data:image"):
                  try:
                      raw = base64.b64decode(logo_data.split(",", 1)[1])
                      logo = RLImage(io.BytesIO(raw))
                      logo._restrictSize(1.6 * inch, 0.7 * inch)
                  except Exception:
                      logo = None

              left = logo if logo else Paragraph(f"<b>{escape(company_name)}</b>", company_style)
              right = Paragraph(f"<b>{escape(company_name)}</b>", company_style) if logo else ""
              header = Table([[left, right]], colWidths=[3.2 * inch, 3.2 * inch])
              header.setStyle(TableStyle([
                  ('VALIGN', (0, 0), (-1, -1), 'MIDDLE'),
                  ('ALIGN', (1, 0), (1, 0), 'RIGHT'),
                  ('BOTTOMPADDING', (0, 0), (-1, -1), 8),
                  ('LINEBELOW', (0, 0), (-1, 0), 0.7, HexColor('#d9e7e5')),
              ]))
              return [header, Spacer(1, 0.16 * inch), Paragraph(escape(report_title), report_style)]

          ''' + pdf_marker
          assert pdf_marker in text, 'PDF helper marker not found'
          text = text.replace(pdf_marker, helper, 1)

          audit_old = '''    story = []
              
              # Header
              story.append(Paragraph("INFINIT-AUDIT", title_style))
              story.append(Paragraph(f"<b>Audit Report: {run_audit['audit_name']}</b>", styles['Heading2']))
              story.append(Spacer(1, 0.3*inch))
          '''
          audit_new = '''    story = []
              company = None
              if audit.get("company_id"):
                  company = await db.companies.find_one({"id": audit.get("company_id")}, {"_id": 0})
              story.extend(build_company_pdf_header(company, f"Audit Report: {run_audit['audit_name']}", styles))
              story.append(Spacer(1, 0.12*inch))
          '''
          assert audit_old in text, 'Audit header block not found'
          text = text.replace(audit_old, audit_new, 1)

          doc_old = '''    story = []
              story.append(Paragraph(doc["template_title"], title_style))
              story.append(Spacer(1, 0.3*inch))
          '''
          doc_new = '''    story = []
              company = None
              if doc.get("company_id"):
                  company = await db.companies.find_one({"id": doc.get("company_id")}, {"_id": 0})
              story.extend(build_company_pdf_header(company, doc["template_title"], styles))
              story.append(Spacer(1, 0.12*inch))
          '''
          assert doc_old in text, 'Single document header block not found'
          text = text.replace(doc_old, doc_new, 1)

          batch_old = '''        story.append(Paragraph(doc["template_title"], title_style))
                  story.append(Spacer(1, 0.3*inch))
          '''
          batch_new = '''        company = None
                  if doc.get("company_id"):
                      company = await db.companies.find_one({"id": doc.get("company_id")}, {"_id": 0})
                  story.extend(build_company_pdf_header(company, doc["template_title"], styles))
                  story.append(Spacer(1, 0.12*inch))
          '''
          assert batch_old in text, 'Batch document header block not found'
          text = text.replace(batch_old, batch_new, 1)

          server.write_text(text)

          cfg = Path('frontend/src/pages/Configuration.js')
          text = cfg.read_text()
          text = text.replace(
              "import { Building2, FolderOpen, Layers, Pencil, Plus, Settings, Trash2 } from 'lucide-react';",
              "import { Building2, FolderOpen, ImageIcon, Layers, Pencil, Plus, Settings, Trash2, Upload } from 'lucide-react';"
          )
          text = text.replace(
              "? ['companies', 'lines-shifts', 'groups']\n    : isConfigurationAdmin ? ['lines-shifts', 'groups'] : ['groups'];",
              "? ['companies', 'branding', 'lines-shifts', 'groups']\n    : isConfigurationAdmin ? ['branding', 'lines-shifts', 'groups'] : ['groups'];"
          )
          text = text.replace(
              "  const [lineDialogOpen, setLineDialogOpen] = useState(false);",
              "  const [brandingCompanyId, setBrandingCompanyId] = useState('');\n  const [lineDialogOpen, setLineDialogOpen] = useState(false);"
          )
          text = text.replace(
              "      if (isSystemAdmin) requests.push(axios.get(`${API}/companies`));",
              "      if (isConfigurationAdmin) requests.push(axios.get(`${API}/companies`));"
          )
          text = text.replace(
              "      if (companiesRes) setCompanies(companiesRes.data);",
              "      if (companiesRes) {\n        setCompanies(companiesRes.data);\n        setBrandingCompanyId((current) => current || (isSystemAdmin ? companiesRes.data[0]?.id : user?.company_id) || '');\n      }"
          )

          hook_marker = '''  const resetLine = () => {
          '''
          branding_funcs = '''  const brandingCompany = companies.find((company) => company.id === brandingCompanyId) || companies[0];

            const uploadCompanyLogo = (event) => {
              const file = event.target.files?.[0];
              event.target.value = '';
              if (!file || !brandingCompany) return;
              const allowed = ['image/png', 'image/jpeg', 'image/webp'];
              if (!allowed.includes(file.type)) {
                toast.error('Logo must be PNG, JPG or WebP');
                return;
              }
              if (file.size > 2 * 1024 * 1024) {
                toast.error('Logo must be 2 MB or smaller');
                return;
              }
              const reader = new FileReader();
              reader.onload = async () => {
                try {
                  await axios.put(`${API}/companies/${brandingCompany.id}/branding`, { logo_data: reader.result });
                  toast.success('Company logo updated');
                  await fetchData();
                } catch (error) {
                  toast.error(error.response?.data?.detail || 'Unable to update company logo');
                }
              };
              reader.readAsDataURL(file);
            };

            const removeCompanyLogo = async () => {
              if (!brandingCompany || !window.confirm('Remove this company logo?')) return;
              try {
                await axios.put(`${API}/companies/${brandingCompany.id}/branding`, { logo_data: null });
                toast.success('Company logo removed');
                await fetchData();
              } catch (error) {
                toast.error(error.response?.data?.detail || 'Unable to remove company logo');
              }
            };

          ''' + hook_marker
          assert hook_marker in text, 'Configuration function marker not found'
          text = text.replace(hook_marker, branding_funcs, 1)

          text = text.replace(
              "<TabsList className={`grid w-full max-w-2xl ${isSystemAdmin ? 'grid-cols-3' : isConfigurationAdmin ? 'grid-cols-2' : 'grid-cols-1'}`}>",
              "<TabsList className={`grid w-full max-w-3xl ${isSystemAdmin ? 'grid-cols-4' : isConfigurationAdmin ? 'grid-cols-3' : 'grid-cols-1'}`}>"
          )
          tab_marker = '''          {isSystemAdmin && <TabsTrigger value="companies"><Building2 className="w-4 h-4 mr-2" />Companies</TabsTrigger>}
                    {isConfigurationAdmin && <TabsTrigger value="lines-shifts"><Layers className="w-4 h-4 mr-2" />Lines/Shifts</TabsTrigger>}
          '''
          tab_new = '''          {isSystemAdmin && <TabsTrigger value="companies"><Building2 className="w-4 h-4 mr-2" />Companies</TabsTrigger>}
                    {isConfigurationAdmin && <TabsTrigger value="branding"><ImageIcon className="w-4 h-4 mr-2" />Branding</TabsTrigger>}
                    {isConfigurationAdmin && <TabsTrigger value="lines-shifts"><Layers className="w-4 h-4 mr-2" />Lines/Shifts</TabsTrigger>}
          '''
          assert tab_marker in text, 'Tabs marker not found'
          text = text.replace(tab_marker, tab_new, 1)

          content_marker = '''        <TabsContent value="lines-shifts" className="mt-6">
          '''
          branding_ui = '''        {isConfigurationAdmin && (
                    <TabsContent value="branding" className="mt-6">
                      <Card>
                        <CardHeader>
                          <CardTitle className="text-lg">Company Branding</CardTitle>
                          <p className="text-sm text-muted-foreground mt-1">This logo is used automatically on audit and document PDF exports.</p>
                        </CardHeader>
                        <CardContent className="space-y-5">
                          {isSystemAdmin && companies.length > 0 && (
                            <div className="space-y-2 max-w-md">
                              <Label htmlFor="branding-company">Company</Label>
                              <select id="branding-company" className="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm" value={brandingCompanyId} onChange={(e) => setBrandingCompanyId(e.target.value)}>
                                {companies.map((company) => <option key={company.id} value={company.id}>{company.name}</option>)}
                              </select>
                            </div>
                          )}
                          {brandingCompany ? (
                            <div className="rounded-lg border p-5 space-y-4 max-w-xl">
                              <div>
                                <p className="font-medium">{brandingCompany.name}</p>
                                <p className="text-sm text-muted-foreground">PNG, JPG or WebP. Maximum 2 MB.</p>
                              </div>
                              {brandingCompany.logo_data ? (
                                <div className="rounded-md border bg-white p-4 flex items-center justify-center min-h-28">
                                  <img src={brandingCompany.logo_data} alt={`${brandingCompany.name} logo`} className="max-h-24 max-w-full object-contain" />
                                </div>
                              ) : (
                                <div className="rounded-md border border-dashed p-8 text-center text-sm text-muted-foreground">No company logo uploaded.</div>
                              )}
                              <div className="flex flex-wrap gap-3">
                                <Label className="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground cursor-pointer hover:bg-primary/90">
                                  <Upload className="w-4 h-4 mr-2" />{brandingCompany.logo_data ? 'Replace Logo' : 'Upload Logo'}
                                  <input type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={uploadCompanyLogo} />
                                </Label>
                                {brandingCompany.logo_data && <Button variant="outline" onClick={removeCompanyLogo}>Remove Logo</Button>}
                              </div>
                            </div>
                          ) : <p className="text-muted-foreground">No company is available for branding.</p>}
                        </CardContent>
                      </Card>
                    </TabsContent>
                  )}

          ''' + content_marker
          assert content_marker in text, 'Branding content marker not found'
          text = text.replace(content_marker, branding_ui, 1)
          cfg.write_text(text)
          PY
      - name: Validate syntax and commit
        run: |
          python -m py_compile backend/server.py
          rm .github/workflows/apply-company-branding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py frontend/src/pages/Configuration.js .github/workflows/apply-company-branding.yml
          git commit -m "Add company logo branding to exports"
          git push origin HEAD:feature/company-logo-branding
