name: Apply audit usability improvements

on:
  push:
    branches:
      - feature/audit-save-photo-usability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-save-photo-usability
      - name: Apply audit usability changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/RunAudit.js')
          s = p.read_text()
          s = s.replace("  const [actionAssignees, setActionAssignees] = useState([]);\n", "  const [actionAssignees, setActionAssignees] = useState([]);\n  const [savedRuns, setSavedRuns] = useState([]);\n", 1)
          s = s.replace("  useEffect(() => {\n    fetchData();\n  }, [runId]);\n", "  useEffect(() => {\n    fetchData();\n  }, [runId]);\n\n  useEffect(() => {\n    if (activeRun) window.scrollTo({ top: 0, behavior: 'smooth' });\n  }, [currentQuestionIndex]);\n", 1)
          old = """        const [auditsRes, groupsRes, linesShiftsRes, assigneesRes] = await Promise.all([\n          axios.get(`${API}/audits`),\n          axios.get(`${API}/response-groups`),\n          axios.get(`${API}/lines-shifts`),\n          axios.get(`${API}/action-assignees`)\n        ]);\n        auditsData = auditsRes.data;\n        groupsData = groupsRes.data;\n        linesShiftsData = linesShiftsRes.data;\n        assigneesData = assigneesRes.data;\n"""
          new = """        const [auditsRes, groupsRes, linesShiftsRes, assigneesRes, savedRunsRes] = await Promise.all([\n          axios.get(`${API}/audits`),\n          axios.get(`${API}/response-groups`),\n          axios.get(`${API}/lines-shifts`),\n          axios.get(`${API}/action-assignees`),\n          axios.get(`${API}/run-audits?completed=false`)\n        ]);\n        auditsData = auditsRes.data;\n        groupsData = groupsRes.data;\n        linesShiftsData = linesShiftsRes.data;\n        assigneesData = assigneesRes.data;\n        setSavedRuns(savedRunsRes.data.filter(run => run.auditor_id === user?.id));\n"""
          if old not in s: raise SystemExit('fetch block not found')
          s = s.replace(old, new, 1)
          old = """        setAnswers(savedAnswers);\n        setNotes(runRes.data.notes || '');\n"""
          new = """        setAnswers(savedAnswers);\n        setNotes(runRes.data.notes || '');\n        const firstUnanswered = audit?.questions?.findIndex(q => !savedAnswers[q.id]?.response_value) ?? -1;\n        setCurrentQuestionIndex(firstUnanswered >= 0 ? firstUnanswered : 0);\n"""
          if old not in s: raise SystemExit('restore block not found')
          s = s.replace(old, new, 1)
          marker = "  const handlePhotoUpload = async (e) => {\n"
          helper = """  const compressAuditPhoto = (file) => new Promise((resolve) => {\n    if (!file?.type?.startsWith('image/')) return resolve(file);\n    const image = new Image();\n    const objectUrl = URL.createObjectURL(file);\n    image.onload = () => {\n      try {\n        const maxDimension = 1600;\n        const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));\n        const canvas = document.createElement('canvas');\n        canvas.width = Math.max(1, Math.round(image.width * scale));\n        canvas.height = Math.max(1, Math.round(image.height * scale));\n        const context = canvas.getContext('2d');\n        context.drawImage(image, 0, 0, canvas.width, canvas.height);\n        canvas.toBlob((blob) => {\n          URL.revokeObjectURL(objectUrl);\n          if (!blob) return resolve(file);\n          const baseName = (file.name || 'audit-photo').replace(/\\.[^.]+$/, '');\n          resolve(new File([blob], `${baseName}.jpg`, { type: 'image/jpeg', lastModified: Date.now() }));\n        }, 'image/jpeg', 0.72);\n      } catch (error) {\n        URL.revokeObjectURL(objectUrl);\n        resolve(file);\n      }\n    };\n    image.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(file); };\n    image.src = objectUrl;\n  });\n\n"""
          if marker not in s: raise SystemExit('photo marker not found')
          s = s.replace(marker, helper + marker, 1)
          s = s.replace("    const file = e.target.files?.[0];\n    if (!file || !currentPhotoQuestion) return;\n    \n    setUploadingPhoto(true);\n    try {\n      const formData = new FormData();\n      formData.append('file', file);\n", "    const file = e.target.files?.[0];\n    if (!file || !currentPhotoQuestion) return;\n    const questionId = currentPhotoQuestion.id;\n    e.target.value = '';\n    \n    setUploadingPhoto(true);\n    try {\n      const compressedFile = await compressAuditPhoto(file);\n      const formData = new FormData();\n      formData.append('file', compressedFile);\n", 1)
          old = """      const currentAnswer = answers[currentPhotoQuestion.id] || {\n        question_id: currentPhotoQuestion.id,\n        response_value: '',\n        response_label: '',\n        score: null,\n        notes: '',\n        photos: []\n      };\n      \n      setAnswers({\n        ...answers,\n        [currentPhotoQuestion.id]: {\n          ...currentAnswer,\n          photos: [...(currentAnswer.photos || []), response.data.url]\n        }\n      });\n"""
          new = """      setAnswers(prev => {\n        const currentAnswer = prev[questionId] || { question_id: questionId, response_value: '', response_label: '', score: null, notes: '', photos: [] };\n        return { ...prev, [questionId]: { ...currentAnswer, photos: [...(currentAnswer.photos || []), response.data.url] } };\n      });\n"""
          if old not in s: raise SystemExit('photo state block not found')
          s = s.replace(old, new, 1)
          old = """  const saveProgress = async () => {\n    if (!activeRun) return;\n    \n    try {\n      await axios.put(`${API}/run-audits/${activeRun.id}`, {\n        answers: Object.values(answers),\n        notes,\n        completed: false\n      });\n      toast.success('Progress saved');\n    } catch (error) {\n      toast.error('Failed to save progress');\n    }\n  };\n"""
          new = """  const saveProgress = async (exitAfterSave = false) => {\n    if (!activeRun) return;\n    if (!isOnline || activeRun.offline) {\n      toast.info('Offline audits are kept on this device and will sync when you reconnect.');\n      if (exitAfterSave) navigate('/run-audit');\n      return;\n    }\n    try {\n      await axios.put(`${API}/run-audits/${activeRun.id}`, { answers: Object.values(answers), notes, completed: false });\n      toast.success(exitAfterSave ? 'Audit saved. You can continue it later.' : 'Progress saved');\n      if (exitAfterSave) navigate('/run-audit');\n    } catch (error) {\n      toast.error('Failed to save progress');\n    }\n  };\n"""
          if old not in s: raise SystemExit('save block not found')
          s = s.replace(old, new, 1)
          marker = "        {/* Location and Line/Shift Input */}\n"
          section = """        {isOnline && savedRuns.length > 0 && (\n          <Card className=\"border-primary/30\">\n            <CardHeader>\n              <CardTitle className=\"text-lg flex items-center gap-2\"><Save className=\"w-5 h-5\" />Saved Audits</CardTitle>\n              <CardDescription>Continue an audit you saved earlier.</CardDescription>\n            </CardHeader>\n            <CardContent className=\"space-y-3\">\n              {savedRuns.map(run => (\n                <div key={run.id} className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 rounded-lg border p-3\">\n                  <div>\n                    <p className=\"font-medium\">{run.audit_name}</p>\n                    <p className=\"text-xs text-muted-foreground\">Started {new Date(run.started_at).toLocaleString('en-GB')}{run.location ? ` • ${run.location}` : ''}</p>\n                  </div>\n                  <Button onClick={() => navigate(`/run-audit/${run.id}`)} data-testid={`continue-audit-${run.id}`}><Play className=\"w-4 h-4 mr-2\" />Continue Audit</Button>\n                </div>\n              ))}\n            </CardContent>\n          </Card>\n        )}\n\n"""
          if marker not in s: raise SystemExit('selection marker not found')
          s = s.replace(marker, section + marker, 1)
          old = """        <Button variant=\"outline\" onClick={saveProgress} data-testid=\"save-progress-btn\">\n          <Save className=\"w-4 h-4 mr-2\" />\n          Save\n        </Button>\n"""
          new = """        <Button variant=\"outline\" onClick={() => saveProgress(true)} data-testid=\"save-progress-btn\">\n          <Save className=\"w-4 h-4 mr-2\" />\n          Save & Exit\n        </Button>\n"""
          if old not in s: raise SystemExit('save button not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify expected changes
        run: |
          grep -q "compressAuditPhoto" frontend/src/pages/RunAudit.js
          grep -q "Saved Audits" frontend/src/pages/RunAudit.js
          grep -q "Save & Exit" frontend/src/pages/RunAudit.js
          grep -q "setAnswers(prev" frontend/src/pages/RunAudit.js
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-audit-usability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/RunAudit.js .github/workflows/apply-audit-usability.yml
          git commit -m "Improve audit saving navigation and photo handling"
          git push origin HEAD:feature/audit-save-photo-usability
