name: Fix action tracker visibility
on:
  push:
    branches:
      - fix/action-tracker-visibility
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/action-tracker-visibility
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/server.py')
          text = path.read_text()
          old = '    query = {"assigned_user_id": user["id"]}\n    actions = await db.corrective_actions.find(query, {"_id": 0}).sort("due_date", 1).to_list(5000)\n'
          new = '    if is_system_admin(user):\n        query = {}\n    elif user["role"] in [UserRole.COMPANY_ADMIN, UserRole.ADMIN, UserRole.AUDIT_CREATOR]:\n        query = {"company_id": user.get("company_id")}\n    else:\n        query = {"assigned_user_id": user["id"]}\n    actions = await db.corrective_actions.find(query, {"_id": 0}).sort("due_date", 1).to_list(5000)\n'
          if old not in text:
              raise SystemExit('actions query block not found')
          text = text.replace(old, new, 1)
          old2 = '    if action.get("assigned_user_id") != user["id"]:\n        raise HTTPException(status_code=403, detail="Access denied")\n    return action\n'
          new2 = '    if action.get("assigned_user_id") == user["id"]:\n        return action\n    if is_system_admin(user):\n        return action\n    if user["role"] in [UserRole.COMPANY_ADMIN, UserRole.ADMIN, UserRole.AUDIT_CREATOR] and action.get("company_id") == user.get("company_id"):\n        return action\n    raise HTTPException(status_code=403, detail="Access denied")\n'
          if old2 not in text:
              raise SystemExit('accessible action block not found')
          path.write_text(text.replace(old2, new2, 1))

          actions_path = Path('frontend/src/pages/Actions.js')
          actions_text = actions_path.read_text()
          actions_text = actions_text.replace('View and complete corrective actions assigned to you.', 'Track corrective actions you are responsible for or permitted to manage.')
          actions_path.write_text(actions_text)

          test_path = Path('backend/tests/test_corrective_actions.py')
          tests = test_path.read_text()
          marker = 'def test_action_tracker_company_visibility_rules_present():'
          if marker not in tests:
              tests += '\n\n' + marker + '\n    source = Path(__file__).resolve().parents[1].joinpath("server.py").read_text()\n    assert "query = {\\\"company_id\\\": user.get(\\\"company_id\\\")}" in source\n    assert "action.get(\\\"company_id\\\") == user.get(\\\"company_id\\\")" in source\n'
              test_path.write_text(tests)
          PY
      - name: Validate
        run: |
          python -m py_compile backend/server.py
          python -m pytest backend/tests/test_corrective_actions.py -q
      - name: Commit fix
        run: |
          rm .github/workflows/fix-action-tracker-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/tests/test_corrective_actions.py frontend/src/pages/Actions.js .github/workflows/fix-action-tracker-visibility.yml
          git commit -m "Fix corrective action tracker visibility"
          git push
