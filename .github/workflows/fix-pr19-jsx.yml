name: Fix PR19 JSX and verify build
on:
  push:
    branches:
      - feature/audit-nc-scoring-photo-pdf
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-nc-scoring-photo-pdf
      - name: Fix repeat NC badge JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/AuditOverview.js')
          t = p.read_text()
          old = """                                {(answer.pass_fail || answer.is_negative !== undefined) && (\n                                  <Badge className={\n                                    (answer.pass_fail === 'fail' || answer.is_negative)\n                                      ? 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'\n                                      : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400'\n                                  }>\n                                    {(answer.pass_fail === 'fail' || answer.is_negative) ? 'Fail' : 'Pass'}\n                                  </Badge>\n                                  {answer.repeat_non_conformance && (\n                                    <Badge className=\"bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400\">Repeat NC ×2</Badge>\n                                  )}\n                                )}"""
          new = """                                {(answer.pass_fail || answer.is_negative !== undefined) && (\n                                  <>\n                                    <Badge className={\n                                      (answer.pass_fail === 'fail' || answer.is_negative)\n                                        ? 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'\n                                        : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400'\n                                    }>\n                                      {(answer.pass_fail === 'fail' || answer.is_negative) ? 'Fail' : 'Pass'}\n                                    </Badge>\n                                    {answer.repeat_non_conformance && (\n                                      <Badge className=\"bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400\">Repeat NC ×2</Badge>\n                                    )}\n                                  </>\n                                )}"""
          if old not in t:
              raise SystemExit('Expected JSX block not found')
          t = t.replace(old, new, 1)
          t = t.replace('  MapPin,\n', '')
          t = t.replace("  const [location, setLocation] = useState('');\n", '')
          p.write_text(t)
          PY
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Commit fix and clean workflow
        run: |
          rm .github/workflows/fix-pr19-jsx.yml
          rm -f .github/workflows/verify-pr19-frontend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/AuditOverview.js frontend/src/pages/RunAudit.js .github/workflows/fix-pr19-jsx.yml .github/workflows/verify-pr19-frontend.yml
          git commit -m "Fix audit overview JSX build error"
          git push origin HEAD:feature/audit-nc-scoring-photo-pdf
