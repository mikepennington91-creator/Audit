name: Apply action tracker fix
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/action-tracker-visibility
      - name: Apply backend fix
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("backend/server.py"); s=p.read_text(); old="    query = {\"assigned_user_id\": user[\"id\"]}\n    actions = await db.corrective_actions.find(query, {\"_id\": 0}).sort(\"due_date\", 1).to_list(5000)\n"; new="    if is_system_admin(user):\n        query = {}\n    elif user[\"role\"] in [UserRole.COMPANY_ADMIN, UserRole.ADMIN, UserRole.AUDIT_CREATOR]:\n        query = {\"company_id\": user.get(\"company_id\")}\n    else:\n        query = {\"assigned_user_id\": user[\"id\"]}\n    actions = await db.corrective_actions.find(query, {\"_id\": 0}).sort(\"due_date\", 1).to_list(5000)\n"; assert old in s; s=s.replace(old,new,1); old2="    if action.get(\"assigned_user_id\") != user[\"id\"]:\n        raise HTTPException(status_code=403, detail=\"Access denied\")\n    return action\n"; new2="    if action.get(\"assigned_user_id\") == user[\"id\"]:\n        return action\n    if is_system_admin(user):\n        return action\n    if user[\"role\"] in [UserRole.COMPANY_ADMIN, UserRole.ADMIN, UserRole.AUDIT_CREATOR] and action.get(\"company_id\") == user.get(\"company_id\"):\n        return action\n    raise HTTPException(status_code=403, detail=\"Access denied\")\n"; assert old2 in s; p.write_text(s.replace(old2,new2,1))'
      - name: Update tracker description
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("frontend/src/pages/Actions.js"); s=p.read_text(); p.write_text(s.replace("View and complete corrective actions assigned to you.", "Track corrective actions you are responsible for or permitted to manage."))'
      - name: Validate
        shell: bash
        run: |
          python -m py_compile backend/server.py
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-action-tracker-visibility.yml .github/workflows/apply-action-tracker-fix-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix corrective action tracker visibility"
          git push
