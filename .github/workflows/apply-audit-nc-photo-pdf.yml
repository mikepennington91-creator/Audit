name: Apply audit NC scoring and PDF photo improvements

on:
  push:
    branches: [feature/audit-nc-scoring-photo-pdf]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-nc-scoring-photo-pdf
      - name: Apply changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # backend/server.py
          p=Path('backend/server.py'); s=p.read_text()
          s=s.replace('    pass_rate: Optional[float] = None\n    is_private: bool = False\n','    pass_rate: Optional[float] = None\n    scoring_mode: str = "percentage"\n    max_non_conformances: Optional[int] = 0\n    is_private: bool = False\n',1)
          s=s.replace('    pass_rate: Optional[float]\n    is_private: bool\n','    pass_rate: Optional[float]\n    scoring_mode: str = "percentage"\n    max_non_conformances: Optional[int] = 0\n    is_private: bool\n',1)
          s=s.replace('    pass_rate: Optional[float] = None\n    is_private: Optional[bool] = None\n','    pass_rate: Optional[float] = None\n    scoring_mode: Optional[str] = None\n    max_non_conformances: Optional[int] = None\n    is_private: Optional[bool] = None\n',1)
          s=s.replace('    pass_fail: Optional[str] = None  # "pass" or "fail" - manual assignment for text questions\n    action_required: Optional[str] = None\n','    pass_fail: Optional[str] = None  # "pass" or "fail" - manual assignment for text questions\n    repeat_non_conformance: bool = False\n    action_required: Optional[str] = None\n',1)
          s=s.replace('    total_score: Optional[float]\n    pass_status: Optional[str]\n','    total_score: Optional[float]\n    non_conformance_count: Optional[int] = None\n    scoring_mode: str = "percentage"\n    max_non_conformances: Optional[int] = 0\n    pass_status: Optional[str]\n',1)
          s=s.replace('        "pass_rate": audit_data.pass_rate,\n        "is_private": audit_data.is_private,\n','        "pass_rate": audit_data.pass_rate,\n        "scoring_mode": audit_data.scoring_mode if audit_data.scoring_mode in {"percentage", "non_conformances"} else "percentage",\n        "max_non_conformances": max(0, audit_data.max_non_conformances or 0),\n        "is_private": audit_data.is_private,\n',1)
          s=s.replace('    if update_data.pass_rate is not None:\n        update_dict["pass_rate"] = update_data.pass_rate\n    if update_data.is_private is not None:\n','    if update_data.pass_rate is not None:\n        update_dict["pass_rate"] = update_data.pass_rate\n    if update_data.scoring_mode is not None:\n        if update_data.scoring_mode not in {"percentage", "non_conformances"}:\n            raise HTTPException(status_code=400, detail="Unknown audit scoring mode")\n        update_dict["scoring_mode"] = update_data.scoring_mode\n    if update_data.max_non_conformances is not None:\n        update_dict["max_non_conformances"] = max(0, update_data.max_non_conformances)\n    if update_data.is_private is not None:\n',1)
          s=s.replace('        "total_score": None,\n        "pass_status": None,\n','        "total_score": None,\n        "non_conformance_count": None,\n        "scoring_mode": audit.get("scoring_mode", "percentage"),\n        "max_non_conformances": audit.get("max_non_conformances", 0),\n        "pass_status": None,\n',1)
          old='''    # Calculate score based on pass/fail per question\n    total_score = None\n    pass_status = None\n    \n    if submit_data.completed:\n        total_questions = len(answers)\n        if total_questions > 0:\n            pass_count = 0\n            for answer in answers:\n                pf = answer.get("pass_fail")\n                if pf == "pass":\n                    pass_count += 1\n                elif pf == "fail":\n                    pass  # counted as fail\n                elif not answer.get("is_negative"):\n                    pass_count += 1  # backward compat: non-negative = pass\n            \n            total_score = (pass_count / total_questions) * 100\n            if audit and audit.get("pass_rate"):\n                pass_status = "pass" if total_score >= audit["pass_rate"] else "fail"\n'''
          new='''    # Calculate the configured audit scoring metric.\n    total_score = None\n    non_conformance_count = None\n    pass_status = None\n    scoring_mode = (audit or {}).get("scoring_mode", run_audit.get("scoring_mode", "percentage"))\n    max_non_conformances = (audit or {}).get("max_non_conformances", run_audit.get("max_non_conformances", 0)) or 0\n    \n    if submit_data.completed:\n        if scoring_mode == "non_conformances":\n            non_conformance_count = sum(2 if a.get("is_negative") and a.get("repeat_non_conformance") else 1 if a.get("is_negative") else 0 for a in answers)\n            pass_status = "pass" if non_conformance_count <= max_non_conformances else "fail"\n        else:\n            total_questions = len(answers)\n            if total_questions > 0:\n                pass_count = 0\n                for answer in answers:\n                    pf = answer.get("pass_fail")\n                    if pf == "pass":\n                        pass_count += 1\n                    elif pf == "fail":\n                        pass\n                    elif not answer.get("is_negative"):\n                        pass_count += 1\n                total_score = (pass_count / total_questions) * 100\n                if audit and audit.get("pass_rate"):\n                    pass_status = "pass" if total_score >= audit["pass_rate"] else "fail"\n'''
          if old not in s: raise SystemExit('score block not found')
          s=s.replace(old,new,1)
          s=s.replace('        "total_score": total_score,\n        "pass_status": pass_status,\n','        "total_score": total_score,\n        "non_conformance_count": non_conformance_count,\n        "scoring_mode": scoring_mode,\n        "max_non_conformances": max_non_conformances,\n        "pass_status": pass_status,\n',1)
          s=s.replace('        ["Location:", run_audit.get("location", "N/A")],\n','',1)
          score_line='        ["Score:", f"{round(run_audit.get(\'total_score\', 0))}%" if run_audit.get(\'total_score\') is not None else "N/A"],\n    ]\n'
          score_new='    ]\n    if run_audit.get("scoring_mode", audit.get("scoring_mode", "percentage")) == "non_conformances":\n        meta_data.append(["Non-Conformances:", str(run_audit.get("non_conformance_count", 0) or 0)])\n    else:\n        meta_data.append(["Score:", f"{round(run_audit.get(\'total_score\', 0))}%" if run_audit.get(\'total_score\') is not None else "N/A"])\n'
          if score_line not in s: raise SystemExit('pdf score line not found')
          s=s.replace(score_line,score_new,1)
          s=s.replace('        if answer.get("is_negative") and answer.get("action_required"):\n','        if answer.get("is_negative") and answer.get("repeat_non_conformance"):\n            q_data.append([Paragraph("<b>Repeat Non-Conformance:</b> Yes (counts as 2)", normal_style)])\n\n        if answer.get("is_negative") and answer.get("action_required"):\n',1)
          s=s.replace('        if answer.get("photos"):\n            q_data.append([Paragraph(f"<b>Photos:</b> {len(answer.get(\'photos\', []))} attached", normal_style)])\n        \n        # Color based on negative response\n','        # Color based on negative response\n',1)
          s=s.replace('        story.append(q_table)\n        story.append(Spacer(1, 0.15*inch))\n','        story.append(q_table)\n        for photo_index, photo_data in enumerate(answer.get("photos") or [], start=1):\n            if not isinstance(photo_data, str) or not photo_data.startswith("data:image") or "," not in photo_data:\n                continue\n            try:\n                photo_img = RLImage(io.BytesIO(base64.b64decode(photo_data.split(",", 1)[1])))\n                photo_img._restrictSize(5.5 * inch, 3.5 * inch)\n                story.append(Spacer(1, 0.08*inch))\n                story.append(Paragraph(f"<b>Evidence Photo {photo_index}</b>", normal_style))\n                story.append(Spacer(1, 0.04*inch))\n                story.append(photo_img)\n            except Exception as exc:\n                logger.warning("Skipping unreadable audit photo in PDF: %s", exc)\n        story.append(Spacer(1, 0.15*inch))\n',1)
          p.write_text(s)

          # frontend/src/pages/CreateAudit.js
          p=Path('frontend/src/pages/CreateAudit.js'); s=p.read_text()
          s=s.replace("  const [passRate, setPassRate] = useState('');\n", "  const [passRate, setPassRate] = useState('');\n  const [scoringMode, setScoringMode] = useState('percentage');\n  const [maxNonConformances, setMaxNonConformances] = useState('0');\n",1)
          s=s.replace("      setPassRate(audit.pass_rate != null ? String(audit.pass_rate) : '');\n", "      setPassRate(audit.pass_rate != null ? String(audit.pass_rate) : '');\n      setScoringMode(audit.scoring_mode || 'percentage');\n      setMaxNonConformances(String(audit.max_non_conformances ?? 0));\n",1)
          s=s.replace("        pass_rate: passRate ? parseFloat(passRate) : null,\n", "        pass_rate: scoringMode === 'percentage' && passRate ? parseFloat(passRate) : null,\n        scoring_mode: scoringMode,\n        max_non_conformances: scoringMode === 'non_conformances' ? Math.max(0, parseInt(maxNonConformances || '0', 10)) : 0,\n",1)
          old='''                <div className="space-y-2">\n                  <Label htmlFor="passRate">Pass Rate (%)</Label>\n                  <Input\n                    id="passRate"\n                    type="number"\n                    placeholder="e.g., 85"\n                    value={passRate}\n                    onChange={(e) => setPassRate(e.target.value)}\n                    min="0"\n                    max="100"\n                    data-testid="pass-rate-input"\n                  />\n                  <p className="text-xs text-muted-foreground">\n                    Minimum pass percentage - audits scoring below this will be flagged as failed\n                  </p>\n                </div>\n'''
          new='''                <div className="flex items-center justify-between p-3 rounded-lg bg-muted">\n                  <div>\n                    <Label htmlFor="nc-scoring">Score by Non-Conformances</Label>\n                    <p className="text-xs text-muted-foreground">Failures count as NCs; repeat failures count double</p>\n                  </div>\n                  <Switch id="nc-scoring" checked={scoringMode === 'non_conformances'} onCheckedChange={(checked) => setScoringMode(checked ? 'non_conformances' : 'percentage')} />\n                </div>\n                {scoringMode === 'non_conformances' ? (\n                  <div className="space-y-2">\n                    <Label htmlFor="maxNCs">Maximum NCs to Pass</Label>\n                    <Input id="maxNCs" type="number" min="0" value={maxNonConformances} onChange={(e) => setMaxNonConformances(e.target.value)} data-testid="max-nc-input" />\n                    <p className="text-xs text-muted-foreground">A normal fail = 1 NC. A repeat non-conformance = 2 NCs.</p>\n                  </div>\n                ) : (\n                  <div className="space-y-2">\n                    <Label htmlFor="passRate">Pass Rate (%)</Label>\n                    <Input id="passRate" type="number" placeholder="e.g., 85" value={passRate} onChange={(e) => setPassRate(e.target.value)} min="0" max="100" data-testid="pass-rate-input" />\n                    <p className="text-xs text-muted-foreground">Minimum pass percentage - audits scoring below this will be flagged as failed</p>\n                  </div>\n                )}\n'''
          if old not in s: raise SystemExit('CreateAudit pass block not found')
          p.write_text(s.replace(old,new,1))

          # frontend/src/pages/RunAudit.js
          p=Path('frontend/src/pages/RunAudit.js'); s=p.read_text()
          s=s.replace("        pass_fail: isNegative ? 'fail' : 'pass'\n", "        pass_fail: isNegative ? 'fail' : 'pass',\n        repeat_non_conformance: isNegative ? (existingAnswer.repeat_non_conformance || false) : false\n",1)
          s=s.replace("        pass_fail: status,\n        is_negative: status === 'fail'\n", "        pass_fail: status,\n        is_negative: status === 'fail',\n        repeat_non_conformance: status === 'fail' ? (currentAns.repeat_non_conformance || false) : false\n",1)
          s=re.sub(r'\n            <div className="flex items-center gap-4">\n              <MapPin className="w-5 h-5 text-muted-foreground" />[\s\S]*?\n            </div>\n', '\n', s, count=1)
          s=s.replace('              {activeRun.location && (\n                <>\n                  <span>•</span>\n                  <MapPin className="w-3 h-3" />\n                  {activeRun.location}\n                </>\n              )}\n','',1)
          s=s.replace('        location: location || null,\n','        location: null,\n',2)
          s=s.replace("{run.location ? ` • ${run.location}` : ''}", '',1)
          marker='            {/* Photo Upload */}\n'
          repeat='''            {currentAnswer?.is_negative && (\n              <div className="flex items-center justify-between rounded-lg border border-amber-300 bg-amber-50/70 p-3 dark:border-amber-900 dark:bg-amber-950/20" data-testid="repeat-nc-toggle">\n                <div>\n                  <Label htmlFor={`repeat-nc-${currentQuestion.id}`}>Repeat Non-Conformance</Label>\n                  <p className="text-xs text-muted-foreground">Counts this failure as 2 non-conformances.</p>\n                </div>\n                <input id={`repeat-nc-${currentQuestion.id}`} type="checkbox" className="h-5 w-5 accent-red-600" checked={!!currentAnswer.repeat_non_conformance} onChange={(e) => updateActionField(currentQuestion.id, 'repeat_non_conformance', e.target.checked)} />\n              </div>\n            )}\n\n            {/* Photo Upload */}\n'''
          if marker not in s: raise SystemExit('RunAudit photo marker not found')
          p.write_text(s.replace(marker,repeat,1))

          # frontend/src/pages/AuditOverview.js
          p=Path('frontend/src/pages/AuditOverview.js'); s=p.read_text()
          s=s.replace('                    <TableHead>Location</TableHead>\n','',1)
          s=s.replace("                      <TableCell className=\"text-muted-foreground\">{run.location || '-'}</TableCell>\n",'',1)
          s=s.replace('''                        {run.total_score !== null ? (\n                          <span className="font-semibold">{Math.round(run.total_score)}%</span>\n                        ) : '-'}\n''','''                        {run.scoring_mode === 'non_conformances' ? (\n                          <span className="font-semibold">{run.non_conformance_count ?? 0} NC{(run.non_conformance_count ?? 0) === 1 ? '' : 's'}</span>\n                        ) : run.total_score !== null ? (\n                          <span className="font-semibold">{Math.round(run.total_score)}%</span>\n                        ) : '-'}\n''',1)
          s=s.replace("                    {selectedRun.total_score !== null && ` - ${Math.round(selectedRun.total_score)}%`}\n", "                    {selectedRun.scoring_mode === 'non_conformances' ? ` - ${selectedRun.non_conformance_count ?? 0} NC${(selectedRun.non_conformance_count ?? 0) === 1 ? '' : 's'}` : selectedRun.total_score !== null ? ` - ${Math.round(selectedRun.total_score)}%` : ''}\n",1)
          s=s.replace('                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 bg-muted/50 rounded-lg">\n','                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-muted/50 rounded-lg">\n',1)
          s=s.replace('''                  <div>\n                    <p className="text-xs text-muted-foreground uppercase tracking-wide">Location</p>\n                    <p className="font-medium">{runDetails.location || '-'}</p>\n                  </div>\n''','',1)
          s=s.replace("                                    {(answer.pass_fail === 'fail' || answer.is_negative) ? 'Fail' : 'Pass'}\n                                  </Badge>\n", "                                    {(answer.pass_fail === 'fail' || answer.is_negative) ? 'Fail' : 'Pass'}\n                                  </Badge>\n                                  {answer.repeat_non_conformance && (\n                                    <Badge className=\"bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400\">Repeat NC ×2</Badge>\n                                  )}\n",1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m py_compile backend/server.py
          grep -q "Score by Non-Conformances" frontend/src/pages/CreateAudit.js
          grep -q "Repeat Non-Conformance" frontend/src/pages/RunAudit.js
          grep -q "Evidence Photo" backend/server.py
      - name: Commit implementation
        run: |
          rm .github/workflows/apply-audit-nc-photo-pdf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py frontend/src/pages/CreateAudit.js frontend/src/pages/RunAudit.js frontend/src/pages/AuditOverview.js .github/workflows/apply-audit-nc-photo-pdf.yml
          git commit -m "Add audit NC scoring and embed PDF photos"
          git push origin HEAD:feature/audit-nc-scoring-photo-pdf
