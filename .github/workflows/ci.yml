name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET_KEY: ci-test-secret
      CORS_ORIGINS: http://localhost:3000
      REMINDER_LOOP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run local regression tests
        run: >-
          pytest -q
          tests/test_corrective_actions.py
          tests/test_document_admin_actions.py
          tests/test_modular_workflows.py
          tests/test_hold_disposal_regressions.py
          tests/test_notice_workflow.py
          tests/test_traceability_excel.py
          tests/test_database.py
          tests/test_audit_deadlines_activity.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Build frontend
        run: yarn build
      - name: Test UK date inputs
        run: CI=true yarn test --watchAll=false --runInBand

  activity-sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/tests/sql
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/tests/sql/package-lock.json
      - run: npm ci
      - run: npm test
