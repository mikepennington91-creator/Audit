name: Apply audit fail overview red

on:
  push:
    branches:
      - feature/audit-fail-overview-red

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-fail-overview-red
      - name: Update failed question overview colour
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/RunAudit.js')
          text = path.read_text()
          text = text.replace(
              "              const answered = answers[q.id]?.response_value;\n",
              "              const answer = answers[q.id];\n              const answered = answer?.response_value;\n              const failed = answer?.is_negative || answer?.pass_fail === 'fail';\n",
              1,
          )
          text = text.replace(
              "                    i === currentQuestionIndex\n                      ? 'bg-primary text-primary-foreground'\n                      : answered\n",
              "                    failed\n                      ? 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400'\n                      : i === currentQuestionIndex\n                      ? 'bg-primary text-primary-foreground'\n                      : answered\n",
              1,
          )
          path.write_text(text)
          PY
      - name: Verify change
        run: |
          grep -q "const failed = answer?.is_negative || answer?.pass_fail === 'fail';" frontend/src/pages/RunAudit.js
          grep -q "bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400" frontend/src/pages/RunAudit.js
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-audit-fail-overview-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/RunAudit.js .github/workflows/apply-audit-fail-overview-red.yml
          git commit -m "Show failed audit questions in red"
          git push origin HEAD:feature/audit-fail-overview-red
